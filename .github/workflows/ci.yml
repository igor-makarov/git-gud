name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up tools with mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l readme.go cmd internal)"
          if [ -n "$files" ]; then
            printf 'These files need gofmt:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/git-gud" ./cmd/git-gud

      - name: Verify embedded README
        run: |
          "$RUNNER_TEMP/git-gud" --readme > "$RUNNER_TEMP/README.md"
          cmp README.md "$RUNNER_TEMP/README.md"

      - name: Check whitespace
        run: git diff --check
